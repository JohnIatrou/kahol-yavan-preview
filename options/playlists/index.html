<!doctype html><html dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=1472"><title>פלייליסטים – עיצובים</title><style>
@font-face{font-family:A;src:url(Assistant-800.ttf);font-weight:800}
@font-face{font-family:A;src:url(Assistant-700.ttf);font-weight:700}
body{margin:0;background:#08122B;font-family:A;color:#fff;padding:28px 36px;width:1400px}
h2{font-size:30px;margin:26px 0 6px} p{margin:0 0 14px;color:#9fb3d9;font-size:18px}
.row{display:flex;gap:18px}
.card{width:205px;height:205px;border-radius:22px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;box-shadow:0 8px 22px #0007}
.card img{width:165px}
.pill{border-radius:999px;padding:7px 16px;font-weight:800;font-size:19px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.e{font-family:'Noto Color Emoji';font-size:18px}
/* A */ .a{background:linear-gradient(135deg,#1b3170,#0d1838)}
/* B */ .b .pill{background:#fff}
/* C */ .c{background:linear-gradient(135deg,#1b3170,#0d1838)}
.c .pill{background:transparent;border:3px solid currentColor}
.c::before{content:'';position:absolute;inset:0;border-radius:22px;border:4px solid var(--k)}
</style></head><body>
<h2>א · כמו בתמונה: רקע כחול כהה, לכל פלייליסט צבע אחר למסגרת השם</h2><p>אחיד ושקט, הלוגו בולט, והצבע מבדיל בין הסגנונות</p>
<div class="row" id="A"></div>
<h2>ב · כל כרטיס בצבע משלו, ושם הפלייליסט במסגרת לבנה</h2><p>הכי צבעוני: קל לזהות סגנון מרחוק, טוב לטלוויזיה</p>
<div class="row" id="B"></div>
<h2>ג · רקע כחול כהה עם מסגרת צבעונית סביב הכרטיס והשם</h2><p>באמצע: צבעוני אבל מאופק</p>
<div class="row" id="C"></div>
<script>
const L=[['שעה שקטה','🌙','#4FC3F7','#0b3a5c'],['שעה שמחה','🎉','#FF7043','#5c1d0b'],['השירים החדשים','✨','#66BB6A','#123d17'],['קלאסיקות','💿','#BA68C8','#3b1446'],['הטופ 20','🏆','#F4B740','#4a3305'],['מגה להיטים','🔥','#EF5350','#4d0d0d']];
const mk=(id,f)=>document.getElementById(id).innerHTML=L.map(f).join('');
mk('A',([n,e,c,d])=>`<div class="card a"><img src="word.png"><div class="pill" style="background:${c};color:#0f1b3a"><span class="e">${e}</span>${n}</div></div>`);
mk('B',([n,e,c,d])=>`<div class="card b" style="background:linear-gradient(135deg,${c},${d})"><img src="word.png"><div class="pill" style="color:${d}"><span class="e">${e}</span>${n}</div></div>`);
mk('C',([n,e,c,d])=>`<div class="card c" style="--k:${c}"><img src="word.png"><div class="pill" style="color:${c}"><span class="e">${e}</span>${n}</div></div>`);
</script></body></html>
